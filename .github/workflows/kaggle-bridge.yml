
name: Kaggle Bridge - First Execution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kaggle-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
      - name: Check credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_USERNAME" || {
            echo "Missing KAGGLE_USERNAME secret"
            exit 1
          }
          test -n "$KAGGLE_KEY" || {
            echo "Missing KAGGLE_KEY secret"
            exit 1
          }
          echo "Kaggle credentials are present."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle six

      - name: Configure Kaggle authentication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import json, os
          p = os.path.expanduser("~/.kaggle/kaggle.json")
          with open(p, "w") as f:
              json.dump({
                  "username": os.environ["KAGGLE_USERNAME"],
                  "key": os.environ["KAGGLE_KEY"]
              }, f)
          os.chmod(p, 0o600)
          PY

      - name: Create Kaggle probe kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel output

          export KERNEL_ID="${KAGGLE_USERNAME}/chatgpt-bridge-probe"

          python - <<'PY'
          import json, os
          metadata = {
              "id": os.environ["KERNEL_ID"],
              "title": "ChatGPT Bridge Connection Probe",
              "code_file": "main.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": False,
              "enable_internet": False,
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          with open("kernel/kernel-metadata.json", "w") as f:
              json.dump(metadata, f, indent=2)
          PY

          cat > kernel/main.py <<'PY'
          import json
          import os
          import platform
          import socket
          import sys
          from datetime import datetime, timezone

          result = {
              "status": "KAGGLE_EXECUTION_SUCCESS",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "python": sys.version,
              "platform": platform.platform(),
              "machine": platform.machine(),
              "cpu_count": os.cpu_count(),
              "hostname": socket.gethostname()
          }

          try:
              import torch
              result["pytorch"] = torch.__version__
              result["cuda_available"] = torch.cuda.is_available()
              if torch.cuda.is_available():
                  result["gpu"] = torch.cuda.get_device_name(0)
          except Exception as e:
              result["pytorch_check"] = str(e)

          os.makedirs("/kaggle/working", exist_ok=True)
          with open("/kaggle/working/bridge_receipt.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))
          PY

          echo "Kernel prepared: $KERNEL_ID"
          kaggle kernels push -p kernel

      - name: Wait for Kaggle execution
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_ID="${KAGGLE_USERNAME}/chatgpt-bridge-probe"
          completed=false

          for i in $(seq 1 30); do
            echo "Kaggle status check $i/30"
            status="$(kaggle kernels status "$KERNEL_ID" 2>&1)" || {
              echo "$status"
              sleep 30
              continue
            }
            echo "$status"

            if echo "$status" | grep -Eqi 'COMPLETE'; then
              completed=true
              break
            fi

            if echo "$status" | grep -Eqi 'ERROR|CANCEL'; then
              echo "Kaggle kernel failed."
              exit 1
            fi

            sleep 30
          done

          if [ "$completed" != "true" ]; then
            echo "Timed out waiting for Kaggle."
            exit 1
          fi

      - name: Retrieve Kaggle result
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_ID="${KAGGLE_USERNAME}/chatgpt-bridge-probe"
          kaggle kernels output "$KERNEL_ID" -p output
          test -s output/bridge_receipt.json
          cat output/bridge_receipt.json

      - name: Save execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-bridge-proof
          path: output/bridge_receipt.json
          if-no-files-found: error
          retention-days: 7
          
